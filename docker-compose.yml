version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - PORT=3000
      - VITE_FRONTEND_API_URL=http://frontend:5173

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend # Optional, usually Vite dev is enough
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_KOYEB_PROCESSING_SERVER_URL=http://localhost:3000
