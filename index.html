<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamVault HUB</title>
    <script>
      // Global suppression for cross-origin third-party script errors in sandboxed iframes
      window.onerror = function(msg, url, line, col, error) {
        if (msg === 'Script error.' || msg === 'Script error' || (!url && !line)) {
          return true;
        }
      };
      window.onunhandledrejection = function(event) {
        if (event && event.reason && typeof event.reason === 'string' && event.reason.includes('Script error')) {
          event.preventDefault();
          return true;
        }
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            // First visit: respect system theme if available, otherwise default to night
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
              document.documentElement.classList.remove('dark');
            } else {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#FFFFFF] dark:bg-[#0B0B0C] text-[#111111] dark:text-[#F3F3F4] min-h-screen font-['Inter',sans-serif] antialiased transition-colors duration-200 selection:bg-neutral-200 dark:selection:bg-white/20 selection:text-black dark:selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
